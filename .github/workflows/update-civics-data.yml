name: Update Civics Data

on:
  workflow_dispatch:

  schedule:
    - cron: "15 12 * * *"


permissions:
  contents: write


jobs:

  update:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v7


      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Update civics data
        run: |
          python scripts/update_civics_data.py


      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- civics_current.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No civics data changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Civics data changed."
          fi


      - name: Commit updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add civics_current.json

          git commit -m "Update current civics data"

          git push
